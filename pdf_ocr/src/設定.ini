; PDF文字認識 の設定ファイル（メモ帳で編集できます）
; 書き換えた行だけが有効になります。行頭に ; を付けると無効になります。

[settings]
; 読み取り方。ふつうは触らなくてかまいません。
; auto  資料の種類を自動で判断する（既定）。横書き・縦書き・図面の
;       どれでもそのまま読めます。
; yoko  横書きだけとして読む。縦書きの読み取りを省くので約半分の時間で
;       終わりますが、縦組みの所は読めません。横書きの書類ばかりで、
;       速さを優先したいときだけ。
; ほかに tate（縦書き）・mixed（縦横混在）・zumen（図面）・eng（英数字）。
;MODE=auto

; ページを画像にするときの解像度。上げると精度が少し上がり、遅くなる。
; 200〜400 くらいが目安。小さい文字が読めないときだけ 400 にする。
DPI=300

; 貼られている画像のほうが細かいときに、そこまで上げてよい上限。
; 本を見開きで取り込んだ PDF などは、小さなページに細かい画像が貼って
; あるので、DPI のままだと画像を縮めてから読むことになり、小さな文字を
; 丸ごと取りこぼす。0 にすると DPI で固定する（前の動きに戻す）。
MAXDPI=600

; 採用する認識の信頼度(0〜100)。下げると拾う文字が増えるが、誤読も増える。
MINCONF=30

; 出力ファイル名の末尾に付ける文字
SUFFIX=_OCR

; すでに文字が入っているページを飛ばすか(yes/no)。
; no にすると、テキスト付き PDF にも重ねて認識する。
SKIPTEXTPAGES=yes

; 何字以上入っていたら「文字入りのページ」と見なすか。
; ページ番号やハンコだけの薄いテキスト層で飛ばされてしまうときは、
; この値を大きくする（例 300）。
TEXTPAGECHARS=100

; 白黒（グレースケール）にしてから読むか(yes/no)。既定は no（色のまま）。
; yes のほうが速くて画像も軽いのですが、色の付いた帯の上に白抜きで組んだ
; 見出しが読めなくなります。オレンジの帯と白い文字は、白黒にすると
; 明るさの差が半分になるためです（実測で「本書の構成とねらい」が
; 「SAS ORE BDU)」に化けました）。手元の 2 ページで比べると、色のままの
; ほうが狙った語を 7/16→10/16、13/16→15/16 と多く拾えました。
; ページ数が多くて時間やメモリが足りないときだけ yes にしてください。
GRAYSCALE=no

; 縦組みの中の数字を拾い直すか(yes/no)。
; 「(昭和25年)」の 25 のような二桁を 1 文字に詰めた数字（縦中横）や、
; 「1950年」のように 1 文字ずつ縦に積んだ数字は、縦書きの言語データでは
; 読めず「(昭和お年)」「1930年」のように化ける。数字に強い読み方で
; もう一度読んで直す。縦書きを含む読み取りのときだけ働く。
NUMBERS=yes

; 横倒し・上下逆のページを自動で立て直してから読むか(yes/no)
AUTOROTATE=yes

; 1 ページを画像にするときの画素数の上限。A1・A0 の図面を 300dpi にすると
; 画像が巨大になるため、この値を超えないように解像度を自動で落とす。
MAXPIXELS=40000000

; 同時に読み取るページ数。0 なら CPU に合わせて自動。
JOBS=0

; tesseract.exe の場所。空なら自動で探す。
; 例) TESSERACT=C:\Program Files\Tesseract-OCR\tesseract.exe
TESSERACT=

; 透明テキストに使うフォント。空なら Windows の MS ゴシックなどを自動で使う。
FONT=

; 出力先フォルダ。空なら元の PDF と同じ場所に保存する。
OUTDIR=

; ここから下は、読み取り方ごとの設定。
; LANG は tesseract の言語データ、PSM はページの読み方（3=文章 / 5=縦書き /
; 6=1つのかたまり / 11=文字が散在 / 12=文字が散在＋並び推定）。

; 自動（既定）。LANG/PSM で読んだあと、LANG2/PSM2 でもう一度読んで
; 縦組みに読めた所だけを差し替える。さらに、取れた文字列が
; SPARSEUNDER 個に満たないページだけ SPARSEPSM でもう一度読み、
; 多いほうを採る（図面・CAD 出力への備え）。
[auto]
LANG=jpn+eng
PSM=3
LANG2=jpn_vert+jpn
PSM2=5
SPARSEPSM=11
SPARSEUNDER=12

[yoko]
LANG=jpn+eng
PSM=3

[tate]
LANG=jpn_vert+jpn
PSM=5

[zumen]
LANG=jpn+eng
PSM=11

[eng]
LANG=eng
PSM=3

; 縦横混在。LANG/PSM で読んだあと、LANG2/PSM2 でもう一度読んで、
; 縦組みに読めた所だけを差し替える。
[mixed]
LANG=jpn+eng
PSM=3
LANG2=jpn_vert+jpn
PSM2=5
